# Free alternative to Fly.io (plan §9.4 / §11.2).
# Dashboard: New → Blueprint → this repo.
# Free web services sleep after idle time. Ping /api/health every 5 minutes
# and warm the URL 20 minutes before the demo/video.

services:
  - type: web
    name: sniff-visa-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEMO_MODE
        value: "1"
      - key: OFFLINE
        value: "0"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RECEIPT_SIGNING_SECRET
        generateValue: true
      - key: SERPAPI_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_SAFE_BROWSING_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
